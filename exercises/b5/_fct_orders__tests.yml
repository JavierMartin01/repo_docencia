version: 2

models:
  - name: fct_orders
    columns:
      - name: order_id
        data_tests:
          # TODO (B5): añade los genéricos unique y not_null
           - unique:
              config:
                severity: warn        # avisa siempre que haya duplicados
                error_if: ">100"      # rompe solo si hay más de 100 filas que fallan
                store_failures: true  # guarda las filas que fallan
            - not_null:
               -config:
                 -severity: error 
            
